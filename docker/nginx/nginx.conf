server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html pages/usuario/login.html;

    # Evita que redirecionamentos alterem ou removam a porta do cliente (ex: :8080)
    absolute_redirect off;
    port_in_redirect off;

    # Encaminha chamadas de API para o container backend
    location /api {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirecionamentos convenientes de rotas comuns
    location = / {
        return 302 /pages/usuario/login.html;
    }

    location = /login {
        return 302 /pages/usuario/login.html;
    }

    location = /dashboard {
        return 302 /pages/dashboard.html;
    }

    # Arquivos estáticos (HTML, JS, CSS, imagens)
    location / {
        try_files $uri $uri/ =404;
    }
}
