
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/assets/js/utils/preferenciasVisuais.js"></script>
<script>
        try {
            document.documentElement.classList.toggle(
                "sidebar-fechada",
                localStorage.getItem("sidebarFechada") === "true"
            );
        } catch {
            // A página mantém o menu aberto se o armazenamento não estiver disponível.
        }
    </script>
<link rel="stylesheet" href="/assets/bootstrap-5.3.8-dist/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/modal.css">
    <link rel="stylesheet" href="/assets/css/pages/modulos/escalacao.css">
    <link rel="stylesheet" href="/assets/css/pages/modulos/partidas.css">
    <link rel="stylesheet" href="/assets/css/pages/modulos/gerenciamento.css">
    <link rel="stylesheet" href="/assets/css/pages/modulos/time.css">
    <link rel="stylesheet" href="/assets/css/pages/modulos/competicao.css">
    <link rel="stylesheet" href="/assets/css/pages/modulos/chaveamento.css">
    <link rel="stylesheet" href="/assets/css/pages/visualizar.css">
    <link rel="icon" type="image/png" href="/assets/img/icon.png">

    <title>Visualizar aluno</title>

    <link rel="modulepreload" href="/assets/js/main.js">
    <link rel="modulepreload" href="/assets/js/pages/aluno/visualizar.js">
    <link rel="stylesheet" href="/assets/css/acessibilidade-tema.css">
</head>
<body>
<app-bar></app-bar>
<app-sidebar></app-sidebar>

<div class="content">
    <header class="header-visualizar">
        <a href="/pages/aluno/listar.html" id="botaoVoltarAluno" class="btn-voltar" aria-label="Voltar">
            <img src="/assets/icons/arrow.svg" alt="">
        </a>
        <div>
            <h1 class="page-title page-title--large">Visualizar aluno</h1>
        </div>
    </header>

    <section class="visu-box escola-identificacao">
        <div class="visu-perfil">
            <img id="fotoAluno" src="/assets/img/no-prof-pic.png" alt="Foto de perfil do aluno">
        </div>
        <div class="escola-identificacao-info">
            <span class="escola-identificacao-label">ALUNO / ATLETA</span>
            <div class="escola-nome-status">
                <h2 id="nomeAluno">Carregando...</h2>
                <span class="badge-status" id="statusAluno">—</span>
            </div>
            <p class="escola-identificacao-descricao">
                Registro do aluno (RA): <strong id="raAluno">—</strong>
            </p>
            <div id="mensagemAluno" class="visu-mensagem" role="status" hidden></div>
        </div>
    </section>

    <div class="escola-grid">
        <section class="visu-box escola-card">
            <div class="escola-card-header">
                <div class="escola-card-icone">
                    <img src="/assets/icons/infos.svg" alt="">
                </div>
                <h2 class="page-title section-title">Informações gerais</h2>
            </div>
            <div class="escola-info-grid">
                <div class="escola-info-item">
                    <span class="escola-info-label">Escola</span>
                    <p id="escolaAluno">—</p>
                </div>
            </div>
        </section>

        <section class="visu-box escola-card">
            <div class="escola-card-header">
                <div class="escola-card-icone">
                    <img src="/assets/icons/tel.svg" alt="">
                </div>
                <h2 class="page-title section-title">Contato</h2>
            </div>
            <div class="escola-info-grid">
                <div class="escola-info-item">
                    <span class="escola-info-label">E-mail</span>
                    <p id="emailAluno">—</p>
                </div>
                <div class="escola-info-item">
                    <span class="escola-info-label">Telefone</span>
                    <p id="telefoneAluno">—</p>
                </div>
            </div>
        </section>

        <section class="visu-box escola-card escola-card--full">
            <div class="escola-card-header">
                <div class="escola-card-icone">
                    <img src="/assets/icons/pin.svg" alt="">
                </div>
                <h2 class="page-title section-title">Endereço</h2>
            </div>
            <div class="escola-info-grid">
                <div class="escola-info-item">
                    <span class="escola-info-label">CEP</span>
                    <p id="cepAluno">—</p>
                </div>
            </div>
        </section>
    </div>
</div>

<script type="module" src="/assets/js/main.js"></script>
<script type="module" src="/assets/js/pages/aluno/visualizar.js"></script>

</body>
</html>
