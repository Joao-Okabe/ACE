<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/assets/bootstrap-5.3.8-dist/css/bootstrap-grid.min.css">

    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/modal.css">
    <link rel="stylesheet" href="/assets/css/pages/lista.css">

    <link rel="icon" type="image/png" href="/assets/img/icon.png">
    
    <title>Escolas</title>

</head>
<body>

<app-bar></app-bar>
<app-sidebar></app-sidebar>

<div class="content">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
        <div>
            <h2 class="form-title">Escolas</h2>
            <p class="form-subtitle">Gerencie as escolas cadastradas.</p>
        </div>

            <button type="button" class="custom-btn custom-btn-primary" id="abrirModalEscola">
            + Adicionar escola
            </button>
    </div>

    <app-lista placeholder="Pesquisar escola"></app-lista>

</div>

<!-- Modal de cadastro -->
<app-modal titulo="Cadastrar escola">
    <form id="form-escola">

        <div class="form-identificacao">
        <div class="form-imagem">
            <label for="img_logo" class="seletor-imagem" id="fotoPerfil" >
                <img src="/assets/img/brasao.jpg" alt="" class="icone-camera" >
                <span class="imagem-adicionar" aria-hidden="true" aria-label="Selecionar imagem">+</span>
            </label>
            <input type="file" accept="image/*" name="img_logo" id="img_logo" hidden>
        </div>

        <div class="form-campos-principais">
         <div class="campo-form">
            <label for="nomeEscola" class="form-label">Nome da escola</label>
            <input class="form-control form-input"type="text" id="nomeEscola" name="nome" placeholder="Digite o nome da escola" required>
        </div>
        
        <div class="campo-form">
            <label for="categoria_administrativa" class="form-label">Categoria</label>
            <select class="form-input" id="categoria_administrativa" name="categoria_administrativa" required>
                <option>Selecione uma categoria</option>
                <option value="" selected disabled>Selecione uma categoria</option>
                    <option value="Escola Municipal">Escola Municipal</option>
                    <option value="Escola Estadual">Escola Estadual</option>
                    <option value="Privada">Privada</option>
            </select>
        </div>  
        </div>
        </div>

        <div class="row">
        <div class="campo-form col-md-6">
            <label for="emailEscola" class="form-label">E-mail da escola</label>
            <input class="form-control form-input" type="email" id="emailEscola" name="email" placeholder="Digite o e-mail da escola" required>
        </div>

        <div class="campo-form col-md-6">
            <label for="senhaEscola" class="form-label">Senha</label>
            <input class="form-control form-input" type="password" id="senhaEscola" name="senha" placeholder="Digite uma senha" required>
        </div>

        <div class="campo-form col-md-6">
            <label for="telefoneEscola" class="form-label">Telefone</label>
            <input class="form-control form-input" type="tel" id="telefoneEscola" name="telefone" placeholder="(00) 00000-0000">
        </div>

        <div class="campo-form col-md-6">
            <label for="cepEscola" class="form-label">CEP</label>
            <input class="form-control form-input" type="text" id="cepEscola" name="cep" placeholder="00000-000" required>
        </div>

        <div class="campo-form col-md-6">
            <label for="logradouroEscola" class="form-label">Logradouro</label>
            <input class="form-control form-input" type="text" id="logradouroEscola" name="logradouro" placeholder="Digite o nome da rua ou avenida" required>
        </div>

        <div class="campo-form col-md-6">
            <label for="numeroEscola" class="form-label">Número</label>
            <input class="form-control form-input" type="text" id="numeroEscola" name="numero" placeholder="Digite o número" required>
        </div>

        <div class="campo-form col-md-6">
            <label for="bairroEscola" class="form-label">Bairro</label>
            <input class="form-control form-input" type="text" id="bairroEscola" name="bairro" placeholder="Digite o bairro" required>
        </div>

        <div class="campo-form col-md-6">
            <label for="cidadeEscola" class="form-label">Cidade</label>
            <input class="form-control form-input" type="text" id="cidadeEscola" name="cidade" placeholder="Digite a cidade" required>
        </div>

        <div class="campo-form col-md-6">
            <label for="ufEscola" class="form-label">UF</label>
            <input class="form-control form-input" type="text" id="ufEscola" name="uf" placeholder="Ex: SP" required>
        </div>
        </div>

        <div class="modal-footer">
                <button type="button" class="custom-btn custom-btn-secondary" data-fechar-modal>  Cancelar </button>
                <button type="submit" class="custom-btn custom-btn-primary"> Cadastrar </button> 
            </div>
    </form>
</app-modal>

<!-- Modal de editar -->
<app-modal titulo="Editar escola">
    <form id="form-editar-escola">

        <input type="hidden" id="editarIdEscola" name="id">

        <div class="form-identificacao">

            <div class="form-imagem">
                <label for="editar_img_logo" class="seletor-imagem">
                    <img src="/assets/img/brasao.jpg" alt="" class="icone-camera">
                    <span class="imagem-adicionar" aria-hidden="true">+</span>
                </label>

                <input type="file" accept="image/*" name="img_logo" id="editar_img_logo" hidden>
            </div>

            <div class="form-campos-principais">

                <div class="campo-form">
                    <label for="editarNomeEscola" class="form-label">Nome da escola</label>
                    <input class="form-control form-input" type="text" id="editarNomeEscola" name="nome" placeholder="Digite o nome da escola" required>
                </div>

                <div class="campo-form">
                    <label for="editarCategoriaEscola" class="form-label">Categoria</label>
                    <select class="form-input" id="editarCategoriaEscola" name="categoria_administrativa" required>
                        <option value="" selected disabled>Selecione uma categoria</option>
                            <option value="Escola Municipal">Escola Municipal</option>
                            <option value="Escola Estadual">Escola Estadual</option>
                            <option value="Privada">Privada</option>
                    </select>
                </div>

            </div>
        </div>

        <div class="row">

            <div class="campo-form col-md-6">
                <label for="editarEmailEscola" class="form-label">E-mail da escola</label>
                <input class="form-control form-input" type="email" id="editarEmailEscola" name="email" placeholder="Digite o e-mail da escola" required>
            </div>

            <div class="campo-form col-md-6">
                <label for="editarTelefoneEscola" class="form-label">Telefone</label>
                <input class="form-control form-input" type="tel" id="editarTelefoneEscola" name="telefone" placeholder="(00) 00000-0000">
            </div>

            <div class="campo-form col-md-6">
                <label for="editarCepEscola" class="form-label">CEP</label>
                <input class="form-control form-input" type="text" id="editarCepEscola" name="cep" placeholder="00000-000" required>
            </div>

            <div class="campo-form col-md-6">
                <label for="editarLogradouroEscola" class="form-label">Logradouro</label>
                <input class="form-control form-input" type="text" id="editarLogradouroEscola" name="logradouro" placeholder="Digite o nome da rua ou avenida" required>
            </div>

            <div class="campo-form col-md-6">
                <label for="editarNumeroEscola" class="form-label">Número</label>
                <input class="form-control form-input" type="text" id="editarNumeroEscola" name="numero" placeholder="Digite o número" required>
            </div>

            <div class="campo-form col-md-6">
                <label for="editarBairroEscola" class="form-label">Bairro</label>
                <input class="form-control form-input" type="text" id="editarBairroEscola" name="bairro" placeholder="Digite o bairro" required>
            </div>

            <div class="campo-form col-md-6">
                <label for="editarCidadeEscola" class="form-label">Cidade</label>
                <input class="form-control form-input" type="text" id="editarCidadeEscola" name="cidade" placeholder="Digite a cidade" required>
            </div>

            <div class="campo-form col-md-6">
                <label for="editarUfEscola" class="form-label">UF</label>
                <input class="form-control form-input" type="text" id="editarUfEscola" name="uf" placeholder="Ex.: SP" maxlength="2" required>
            </div>

            <div class="modal-footer">
                <button type="button" class="custom-btn custom-btn-secondary" data-fechar-modal>  Cancelar </button>
                <button type="submit" class="custom-btn custom-btn-primary"> Confirmar </button> 
            </div>

        </div>
    </form>
</app-modal>


<script type="module" src="/assets/js/main.js"></script>
<script type="module" src="/assets/js/pages/escola/listar.js"></script>

</body>
</html>
