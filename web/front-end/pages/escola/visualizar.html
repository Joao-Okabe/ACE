<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/assets/bootstrap-5.3.8-dist/css/bootstrap-grid.min.css">

    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/pages/visualizar.css">

    <link rel="icon" type="image/png" href="/assets/img/icon.png">

    <title>Visualizar escola</title>
</head>
<body>

<app-bar></app-bar>
<app-sidebar></app-sidebar>

<div class="content">
    <header class="header-visualizar">
        <a href="listar.html" class="btn-voltar" aria-label="Voltar para a lista de escolas">
            <span aria-hidden="true">←</span>
        </a>
            <h1 class="visu-title">Visualizar escola</h1>
    </header>

    <div class="mb-3">
        <p class="form-subtitle">Confira todas as informações da escola.</p>
    </div>

        <div class="visu-box visu-identificacao">
            <div class="visu-perfil">
                <img id="brasaoEscola" src="/assets/img/brasao.jpg" alt="Brasão da escola">
            </div>

            <div class="visu-identificacao-info">
                <div class="visu-nome-status">
                    <h2 class="page-title page-title--large" id="nomeEscola">Carregando...</h2>
                    <span class="badge-status" id="statusEscola">—</span>
                </div>

                <div class="info-section">
                    <h3 class="section-title">Categoria administrativa</h3>
                    <p class="value-info" id="categoriaEscola">—</p>
                </div>

                <div id="mensagemEscola" class="visu-mensagem" role="status" hidden></div>

                <button type="button" class="custom-btn custom-btn-primary" id="botaoStatusEscola" hidden>
                    Alterar status
                </button>
            </div>
        </div>

        <div class="visu-grid">

            <div class="visu-box">
                <h2 class="page-title section-title">Informações gerais</h2>

                <div class="info-grid">
                    <div class="info-section">
                        <h3 class="page-title">Nome da escola</h3>
                        <p id="nomeEscolaInfo">—</p>
                    </div>

                    <div class="info-section">
                        <h3 class="page-title">Categoria</h3>
                        <p id="categoriaEscolaInfo">—</p>
                    </div>
                </div>
            </div>

            <div class="visu-box">
                <h2 class="page-title section-title">Contato</h2>

                <div class="info-grid">
                    <div class="info-section">
                        <h3 class="page-title">E-mail</h3>
                        <p id="emailEscola">—</p>
                    </div>

                    <div class="info-section">
                        <h3 class="page-title">Telefone</h3>
                        <p id="telefoneEscola">—</p>
                    </div>
                </div>
            </div>

            <div class="visu-box visu-box--full">
                <h2 class="page-title section-title">Endereço</h2>

                <div class="info-grid">
                    <div class="info-section">
                        <h3 class="page-title">CEP</h3>
                        <p id="cepEscola">—</p>
                    </div>

                    <div class="info-section">
                        <h3 class="page-title">Número</h3>
                        <p id="numeroEscola">—</p>
                    </div>
                </div>
            </div>
    </div>
</div>

<script type="module" src="/assets/js/main.js"></script>
<script type="module" src="/assets/js/pages/escola/visualizar.js"></script>

</body>
</html>
