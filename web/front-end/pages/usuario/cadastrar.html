<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/assets/bootstrap-5.3.8-dist/css/bootstrap-grid.min.css">

    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/pages/auth.css">

    <link rel="icon" type="image/png" href="/assets/img/icon.png">

    <title>Cadastro</title>

</head>
<body> 

<div class="container-auth">
    <div class="auth-card auth-card-cadastro">
    
        <div class="auth-card-left">
            <img src="/assets/img/logo-ace-completa.png" class="auth-logo" alt="ACE!">
            <h3>
                CONECTANDO A SUA ESCOLA<br>
                AO ESPORTE!
            </h3>
        </div>

    <div class="auth-card-right">
        <h1>Cadastro</h1>

            <div id="auth-error" class="auth-error" role="alert" aria-live="assertive" hidden></div>

            <div id="auth-success" class="auth-success" role="status" aria-live="polite" hidden></div>

            <form id="form-cadastro">

                    <label for="nome">Nome completo</label>
                    <div class="form-input-group mb-3">
                        <input type="text" id="nome" name="nome" class="form-input" placeholder="Digite seu nome completo" autocomplete="name" required>
                    </div>

                    <label for="email">E-mail</label>
                    <div class="form-input-group mb-3">
                        <input type="email" id="email" name="email" class="form-input" placeholder="Digite seu e-mail" autocomplete="email" required>
                    </div>

                    <label for="senha">Senha</label>
                    <div class="form-input-group">
                        <input type="password" id="senha" name="senha" class="form-input" placeholder="Digite sua senha" autocomplete="current-password" required>
                        <button type="button" id="toggle-senha" class="btn-toggle-password" title="Mostrar senha" data-toggle-senha="#senha">
                            <img src="/assets/icons/eye.svg" class="icon" alt="" >
                        </button>
                    </div>

                    <div class="mt-3 mb-3">
                        <button type="submit" class="custom-btn custom-btn-primary auth-submit">Cadastrar</button>
                    </div>

                    <a href="/pages/usuario/login.html" class="auth-link">Já possui conta? Login</a>

            </form>
            
        </div>
    </div>
</div>
            

<script type="module" src="/assets/js/pages/usuario/cadastro.js"></script>

</body>
</html>
